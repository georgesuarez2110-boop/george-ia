#side { width: 288px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; padding: 16px 12px; }
.brandrow { display: flex; align-items: center; gap: 10px; padding: 2px 6px; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
.newbtn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: 0; border-radius: 12px; padding: 11px 14px; font-weight: 700; font-size: 15px; text-align: left; }
.newbtn:hover { filter: brightness(1.08); }
#chats { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.chat { display: flex; align-items: center; border-radius: 10px; }
.chat:hover, .chat.active { background: var(--panel2); }
.chat .open { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 9px 10px; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.chat.active .open, .chat:hover .open { color: var(--text); }
.chat .del { background: none; border: 0; color: var(--muted); font-size: 18px; line-height: 1; padding: 6px 10px; opacity: 0; }
.chat:hover .del, .chat.active .del, .chat .del:focus-visible { opacity: 1; }
.chat .del:hover { color: var(--danger); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 10px; }
#shade { display: none; position: fixed; inset: 0; background: rgba(5, 9, 20, 0.6); z-index: 20; }
#view { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.top h2 { margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#menu { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 14px; }
#scroller { flex: 1; overflow-y: auto; }
#log { max-width: 800px; margin: 0 auto; padding: 24px 20px 8px; display: flex; flex-direction: column; gap: 22px; }
.welcome { max-width: 640px; margin: 0 auto; padding: 9vh 20px 0; text-align: center; }
.welcome .orb { width: 112px; height: 112px; margin: 0 auto 18px; animation: breathe 4.5s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.welcome h1 { font-size: clamp(30px, 6vw, 46px); line-height: 1.1; letter-spacing: -0.025em; font-weight: 800; margin: 0 0 12px; background: linear-gradient(120deg, var(--text) 30%, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.welcome p { color: var(--muted); margin: 0 0 28px; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 14.5px; line-height: 1.4; }
.chip:hover { border-color: var(--accent); background: var(--panel2); }
.msg.user { display: flex; justify-content: flex-end; }
.ubub { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; padding: 10px 16px; border-radius: 18px 18px 4px 18px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.assistant { display: flex; gap: 14px; align-items: flex-start; }
.msg.assistant .orb { width: 34px; height: 34px; margin-top: 0; }
.col { flex: 1; min-width: 0; }
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md p { margin: 0 0 0.85em; }
.md h2, .md h3, .md h4 { line-height: 1.25; margin: 1.3em 0 0.5em; letter-spacing: -0.01em; }
.md h2 { font-size: 1.35em; }
.md h3 { font-size: 1.15em; }
.md h4 { font-size: 1.02em; color: var(--muted); }
.md ul, .md ol { margin: 0 0 0.85em; padding-left: 1.4em; }
.md li { margin: 0.25em 0; }
.md li::marker { color: var(--accent); }
.md blockquote { margin: 0 0 0.85em; padding: 4px 0 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
.md a { color: var(--accent); }
.md code { background: var(--panel2); padding: 2px 6px; border-radius: 6px; font-size: 0.9em; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.code { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: 0.4em 0 1em; overflow: hidden; }
.code-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 14px; background: var(--panel2); font-size: 13px; color: var(--muted); }
.code-copy { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; font-size: 12.5px; color: var(--text); }
.code-copy:hover { border-color: var(--accent); }
.code pre { margin: 0; padding: 14px; overflow-x: auto; }
.code pre code { background: none; padding: 0; font-size: 13.5px; line-height: 1.55; }
.acts { display: flex; gap: 6px; margin-top: 4px; }
.act { background: none; border: 1px solid transparent; border-radius: 8px; padding: 3px 10px; font-size: 13px; color: var(--muted); }
.act:hover { border-color: var(--line); color: var(--text); }
.msg.assistant:not(.last) .regen, .msg.thinking .acts { display: none; }
.msg.thinking .md:empty::after { content: ""; display: inline-block; width: 10px; height: 10px; margin-top: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }
.pic { margin: 4px 0 6px; }
.pic:empty { display: none; }
.pic img { display: block; width: min(100%, 460px); aspect-ratio: 1; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); }
.msg.img .md { color: var(--muted); }
.msg.img .md:empty { display: none; }
.imgbtn { align-self: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.imgbtn:hover { border-color: var(--accent); }
.imgbtn.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; }
@media (prefers-reduced-motion: no-preference) {
  .msg.img.thinking .md::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
}
footer { padding: 8px 20px 18px; }
#note { max-width: 800px; margin: 0 auto 8px; color: var(--danger); font-size: 14px; min-height: 0; }
.composer { max-width: 800px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 8px 8px 8px 18px; }
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
textarea { flex: 1; background: transparent; color: var(--text); border: 0; outline: none; resize: none; font-family: inherit; font-size: 16px; line-height: 1.5; max-height: 180px; padding: 8px 0; }
textarea::placeholder { color: var(--muted); }
#send { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: 0; border-radius: 14px; padding: 10px 20px; font-weight: 700; font-size: 15px; }
#send.stop { background: var(--panel2); color: var(--text); }
@media (max-width: 820px) {
  #side { position: fixed; left: 0; top: 0; bottom: 0; z-index: 30; padding-top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-100%); transition: transform 0.2s ease; }
  #side.open { transform: translateX(0); }
  #shade.open { display: block; }
  #menu { display: block; }
  .chips { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .welcome .orb, .msg.thinking .md:empty::after { animation: none; }
  #side { transition: none; }
}
</style>
</head>
<body>
<aside id="side">
  <div class="brandrow"><div class="orb"></div>George IA</div>
  <button class="newbtn" id="new" type="button">Nueva conversación</button>
  <nav id="chats" aria-label="Historial de conversaciones"></nav>
</aside>
<div id="shade"></div>
<section id="view">
  <div class="top">
    <button id="menu" type="button">Chats</button>
    <h2 id="title">Nueva conversación</h2>
  </div>
  <main id="scroller">
    <div id="welcome" class="welcome">
      <div class="orb"></div>
      <h1>Hola, soy George IA</h1>
      <p>Pregúntame lo que quieras: ideas, textos, código, dibujos o dudas del día a día.</p>
      <div class="chips">
        <button class="chip" type="button">Explícame algo difícil de forma simple</button>
        <button class="chip" type="button">Ayúdame a redactar un mensaje</button>
        <button class="chip" type="button">Crea una imagen de un atardecer en la playa</button>
        <button class="chip" type="button">Escribe un script de ejemplo y explícalo</button>
      </div>
    </div>
    <div id="log" aria-live="polite"></div>
  </main>
  <footer>
    <div id="note" role="status"></div>
    <div class="composer">
      <button class="imgbtn" id="imgmode" type="button" aria-pressed="false">Imagen</button>
      <textarea id="input" rows="1" placeholder="Escribe un mensaje a George IA" aria-label="Mensaje"></textarea>
      <button id="send" type="button">Enviar</button>
    </div>
  </footer>
</section>
<script>
const KEY = "george-ia-v2";
const $ = (id) => document.getElementById(id);
const el = { log: $("log"), welcome: $("welcome"), scroller: $("scroller"), input: $("input"), send: $("send"), list: $("chats"), title: $("title"), side: $("side"), shade: $("shade"), note: $("note"), imgBtn: $("imgmode") };
let store = load();
let controller = null;
let busy = false;
let noteTimer = null;

function load() {
  try {
    const data = JSON.parse(localStorage.getItem(KEY) || "null");
    if (data && Array.isArray(data.chats)) return data;
  } catch (e) {
    return { chats: [], current: null };
  }
  return { chats: [], current: null };
}

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(store));
  } catch (e) {
    return;
  }
}

function current() {
  return store.chats.find((c) => c.id === store.current) || null;
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

function codeBlock(code, lang) {
  return '<div class="code"><div class="code-head"><span>' + esc(lang || "código") + '</span><button class="code-copy" type="button">Copiar</button></div><pre><code>' + esc(code) + "</code></pre></div>";
}

function renderMd(text) {
  const lines = text.split("\n");
  let html = "";
  let list = null;
  let para = [];
  let i = 0;
  const flush = () => {
    if (para.length) {
      html += "<p>" + para.map(inline).join("<br>") + "</p>";
      para = [];
    }
  };
  const close = () => {
    if (list) {
      html += "</" + list + ">";
      list = null;
    }
  };
  const item = (kind, content) => {
    flush();
    if (list !== kind) {
      close();
      html += "<" + kind + ">";
      list = kind;
    }
    html += "<li>" + inline(content) + "</li>";
  };
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^```(\w*)/);
    if (fence) {
      flush();
      close();
      const code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) {
        code.push(lines[i]);
        i++;
      }
      html += codeBlock(code.join("\n"), fence[1]);
      i++;
      continue;
    }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) {
      flush();
      close();
      const n = m[1].length + 1;
      html += "<h" + n + ">" + inline(m[2]) + "</h" + n + ">";
    } else if ((m = line.match(/^\s*[-*]\s+(.*)/))) {
      item("ul", m[1]);
    } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
      item("ol", m[1]);
    } else if ((m = line.match(/^>\s?(.*)/))) {
      flush();
      close();
      html += "<blockquote>" + inline(m[1]) + "</blockquote>";
    } else if (/^-{3,}$/.test(line.trim())) {
      flush();
      close();
      html += "<hr>";
    } else if (line.trim() === "") {
      flush();
      close();
    } else {
      close();
      para.push(line);
    }
    i++;
  }
  flush();
  close();
  return html;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      const ok = document.execCommand("copy");
      area.remove();
      return ok;
    } catch (e2) {
      return false;
    }
  }
}

function flash(btn, label) {
  const old = btn.dataset.label || btn.textContent;
  btn.dataset.label = old;
  btn.textContent = label;
  setTimeout(() => {
    btn.textContent = old;
  }, 1400);
}

function scrollDown() {
  el.scroller.scrollTop = el.scroller.scrollHeight;
}

function showNote(text) {
  el.note.textContent = text;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => {
    el.note.textContent = "";
  }, 7000);
}

function autoGrow() {
  el.input.style.height = "auto";
  el.input.style.height = Math.min(el.input.scrollHeight, 180) + "px";
}

function setBusy(value) {
  busy = value;
  el.send.textContent = value ? "Detener" : "Enviar";
  el.send.classList.toggle("stop", value);
}

let imageMode = false;

function setImageMode(on) {
  imageMode = on;
  el.imgBtn.setAttribute("aria-pressed", String(on));
  el.imgBtn.classList.toggle("on", on);
  el.input.placeholder = on ? "Describe la imagen que quieres crear" : "Escribe un mensaje a George IA";
}

function wantsImage(text) {
  if (/^\s*(?:por favor[, ]*)?(?:dibuja|dibujar|dib[uú]jame)\s/i.test(text)) return true;
  return /^\s*(?:por favor[, ]*)?(?:cr[eé]ame|crea|crear|genera|generar|gen[eé]rame|dibuja|dibujar|dib[uú]jame|hazme|haz|hacer|dise[ñn]a|dise[ñn]ar|dise[ñn]ame)\s[^.\n]{0,40}?(?:imagen|im[aá]genes|dibujo|ilustraci[oó]n|logo|p[oó]ster|foto|fondo de pantalla|wallpaper|avatar|retrato)/i.test(text);
}

function svgDataUri(svg) {
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

function extractSvg(text) {
  const m = text.match(/<svg[\s\S]*<\/svg>/i);
  if (!m) return "";
  let svg = m[0]
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi, "")
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi, "")
    .replace(/(xlink:)?href\s*=\s*("(?!#)[^"]*"|'(?!#)[^']*')/gi, "");
  const head = svg.slice(0, 300);
  if (!/xmlns\s*=/.test(head)) svg = svg.replace(/<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
  if (/xlink:/.test(svg) && !/xmlns:xlink/.test(svg)) svg = svg.replace(/<svg/i, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
  return svg;
}

function setImage(row, svg) {
  row._raw = svg;
  const pic = row.querySelector(".pic");
  pic.innerHTML = "";
  const img = document.createElement("img");
  img.alt = row._prompt || "Imagen creada por George IA";
  img.src = svgDataUri(svg);
  pic.appendChild(img);
}

function svgToPng(svg) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 1024;
      canvas.getContext("2d").drawImage(img, 0, 0, 1024, 1024);
      canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("png"))), "image/png");
    };
    img.onerror = () => reject(new Error("png"));
    img.src = svgDataUri(svg);
  });
}

async function saveFile(btn, kind) {
  const row = btn.closest(".msg");
  const svg = row && row._raw;
  if (!svg) return;
  const name = "george-ia-" + Date.now().toString(36);
  try {
    const blob = kind === "svg" ? new Blob([svg], { type: "image/svg+xml" }) : await svgToPng(svg);
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = name + "." + kind;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (err) {
    showNote("No se pudo descargar la imagen.");
  }
}

function setAnswer(row, text) {
  row._raw = text;
  row.querySelector(".md").innerHTML = renderMd(text);
}

function addMsg(role, text, kind, prompt) {
  const row = document.createElement("div");
  row.className = "msg " + role;
  if (role === "user") {
    const bubble = document.createElement("div");
    bubble.className = "ubub";
    bubble.textContent = text;
    row.appendChild(bubble);
  } else if (kind === "image") {
    row.classList.add("img");
    row._prompt = prompt || "";
    row.innerHTML = '<div class="orb"></div><div class="col"><div class="md"></div><div class="pic"></div><div class="acts"><button class="act dl-svg" type="button">Descargar SVG</button><button class="act dl-png" type="button">Descargar PNG</button><button class="act regen" type="button">Regenerar</button></div></div>';
    if (text) setImage(row, text);
  } else {
    row.innerHTML = '<div class="orb"></div><div class="col"><div class="md"></div><div class="acts"><button class="act copy" type="button">Copiar</button><button class="act regen" type="button">Regenerar</button></div></div>';
    setAnswer(row, text);
  }
  el.log.appendChild(row);
  el.welcome.style.display = "none";
  scrollDown();
  return row;
}

function refreshLast() {
  el.log.querySelectorAll(".msg.assistant").forEach((m) => m.classList.remove("last"));
  const lastRow = el.log.lastElementChild;
  if (!busy && lastRow && lastRow.classList.contains("assistant")) lastRow.classList.add("last");
}

function renderSidebar() {
  el.list.innerHTML = "";
  if (!store.chats.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Tus conversaciones aparecerán aquí.";
    el.list.appendChild(empty);
    return;
  }
  [...store.chats].sort((a, b) => b.updated - a.updated).forEach((c) => {
    const row = document.createElement("div");
    row.className = "chat" + (c.id === store.current ? " active" : "");
    const open = document.createElement("button");
    open.className = "open";
    open.type = "button";
    open.textContent = c.title;
    open.onclick = () => selectChat(c.id);
    const del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "×";
    del.setAttribute("aria-label", "Borrar conversación");
    del.onclick = () => deleteChat(c.id);
    row.append(open, del);
    el.list.appendChild(row);
  });
}

function renderMessages() {
  el.log.innerHTML = "";
  const chat = current();
  el.welcome.style.display = chat && chat.messages.length ? "none" : "";
  el.title.textContent = chat ? chat.title : "Nueva conversación";
  if (chat) chat.messages.forEach((m) => addMsg(m.role, m.content, m.kind, m.prompt));
  refreshLast();
  el.scroller.scrollTop = el.scroller.scrollHeight;
}

function renderAll() {
  setBusy(false);
  renderSidebar();
  renderMessages();
}

function closeSide() {
  el.side.classList.remove("open");
  el.shade.classList.remove("open");
}

function stop() {
  if (controller) controller.abort();
}

function newChat() {
  stop();
  store.current = null;
  persist();
  renderAll();
  closeSide();
  el.input.focus();
}

function selectChat(id) {
  stop();
  store.current = id;
  persist();
  renderAll();
  closeSide();
}

function deleteChat(id) {
  if (store.current === id) stop();
  store.chats = store.chats.filter((c) => c.id !== id);
  if (store.current === id) store.current = null;
  persist();
  renderAll();
}

function buildInput(chat) {
  let list = chat.messages.slice(-30).map((m) => (m.kind === "image" ? { role: m.role, content: "[Imagen creada a partir de: " + m.prompt + "]" } : { role: m.role, content: m.content }));
  while (list.length && list[0].role !== "user") list = list.slice(1);
  return list;
}

function friendlyError(err) {
  if (err && err.serverMessage) return err.serverMessage;
  if (err && err.code === "not_granted") return "Necesitas aceptar el permiso para que George IA pueda responder. Vuelve a enviar tu mensaje y acepta.";
  if (err && err.code === "rate_limited") return "Demasiados mensajes seguidos. Espera un momento e inténtalo de nuevo.";
  return "George IA no pudo responder. Inténtalo de nuevo.";
}

function rollback(chat, row, note) {
  row.remove();
  const wasCurrent = store.current === chat.id;
  const last = chat.messages.pop();
  if (!chat.messages.length) {
    store.chats = store.chats.filter((c) => c !== chat);
    if (wasCurrent) store.current = null;
  }
  persist();
  if (wasCurrent) {
    renderAll();
    if (last) {
      el.input.value = last.content;
      autoGrow();
    }
  } else {
    renderSidebar();
  }
  if (note) showNote(note);
}

async function run(chat) {
  const row = addMsg("assistant", "");
  row.classList.add("thinking");
  setBusy(true);
  refreshLast();
  controller = new AbortController();
  const mine = controller;
  let answer = "";
  let failed = null;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "chat", messages: buildInput(chat) }),
      signal: mine.signal
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw { serverMessage: data.error || "Error del servidor." };
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      answer += decoder.decode(value, { stream: true });
      row.classList.remove("thinking");
      setAnswer(row, answer);
      if (store.current === chat.id) scrollDown();
    }
  } catch (err) {
    const aborted = err && (err.name === "AbortError" || err.code === "aborted");
    if (err && err.text && !answer) answer = err.text;
    if (!aborted) failed = err;
  }

  if (!answer) {
    rollback(chat, row, failed ? friendlyError(failed) : "");
    return;
  }

  row.classList.remove("thinking");
  setAnswer(row, answer);
  chat.messages.push({ role: "assistant", content: answer });
  chat.updated = Date.now();
  persist();
  renderSidebar();
  setBusy(false);
  refreshLast();
  el.input.focus();
}

async function runImage(chat, prompt) {
  const row = addMsg("assistant", "", "image", prompt);
  const status = row.querySelector(".md");
  status.textContent = "Dibujando tu imagen…";
  row.classList.add("thinking");
  setBusy(true);
  refreshLast();
  controller = new AbortController();
  const mine = controller;
  let svg = "";
  let failed = null;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "image", prompt: prompt }),
      signal: mine.signal
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw { serverMessage: data.error || "Error del servidor." };
    }
    svg = extractSvg(await res.text());
  } catch (err) {
    const aborted = err && (err.name === "AbortError" || err.code === "aborted");
    if (!aborted) failed = err || {};
  }

  if (!svg) {
    const note = failed ? friendlyError(failed) : mine.signal.aborted ? "" : "No pude crear esa imagen. Prueba con otra descripción.";
    rollback(chat, row, note);
    return;
  }

  row.classList.remove("thinking");
  status.textContent = "";
  setImage(row, svg);
  chat.messages.push({ role: "assistant", kind: "image", prompt: prompt, content: svg });
  chat.updated = Date.now();
  persist();
  renderSidebar();
  setBusy(false);
  refreshLast();
  scrollDown();
  el.input.focus();
}

function send(text) {
  let chat = current();
  if (!chat) {
    chat = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: "Nueva conversación", messages: [], updated: Date.now() };
    store.chats.push(chat);
    store.current = chat.id;
  }
  if (!chat.messages.length) chat.title = text.length > 38 ? text.slice(0, 38) + "…" : text;
  chat.messages.push({ role: "user", content: text });
  chat.updated = Date.now();
  persist();
  el.note.textContent = "";
  el.title.textContent = chat.title;
  renderSidebar();
  const asImage = imageMode || wantsImage(text);
  setImageMode(false);
  addMsg("user", text);
  if (asImage) runImage(chat, text);
  else run(chat);
}

function regenerate() {
  if (busy) return;
  const chat = current();
  if (!chat || !chat.messages.length) return;
  if (chat.messages[chat.messages.length - 1].role !== "assistant") return;
  const removed = chat.messages.pop();
  persist();
  el.log.lastElementChild.remove();
  if (removed.kind === "image") runImage(chat, removed.prompt);
  else run(chat);
}

function submit() {
  if (busy) {
    stop();
    return;
  }
  const text = el.input.value.trim();
  if (!text) return;
  el.input.value = "";
  autoGrow();
  send(text);
}

el.send.addEventListener("click", submit);
el.input.addEventListener("input", autoGrow);
el.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    submit();
  }
});
$("new").addEventListener("click", newChat);
el.imgBtn.addEventListener("click", () => setImageMode(!imageMode));
$("menu").addEventListener("click", () => {
  el.side.classList.add("open");
  el.shade.classList.add("open");
});
el.shade.addEventListener("click", closeSide);
document.querySelectorAll(".chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    if (busy) return;
    el.input.value = chip.textContent;
    submit();
  });
});
el.log.addEventListener("click", async (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.classList.contains("code-copy")) {
    const code = btn.closest(".code").querySelector("code").textContent;
    flash(btn, (await copyText(code)) ? "Copiado" : "No se pudo");
  } else if (btn.classList.contains("copy")) {
    const row = btn.closest(".msg");
    flash(btn, (await copyText(row._raw || "")) ? "Copiado" : "No se pudo");
  } else if (btn.classList.contains("dl-svg")) {
    saveFile(btn, "svg");
  } else if (btn.classList.contains("dl-png")) {
    saveFile(btn, "png");
  } else if (btn.classList.contains("regen")) {
    regenerate();
  }
});

renderAll();
el.input.focus();
</script>
</body>
</html>
